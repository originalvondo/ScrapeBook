<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrapeBook</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <!-- Compact header keeps the extension identity visible without distraction. -->
      <header class="header">
        <div class="header-title-group">
          <img class="header-icon" src="../icons/facebook.png" alt="ScrapeBook" width="28" height="28" />
          <div>
            <p class="eyebrow">ScrapeBook</p>
            <h1>Facebook Post Scanner</h1>
          </div>
        </div>
        <span class="status" id="status"><i></i>Stopped</span>
      </header>

      <section class="metric-row" aria-label="Scanner status">
        <div class="metric"><span>Phase</span><strong id="phase">Ready</strong></div>
        <div class="metric"><span>Posts</span><strong id="post-count">0</strong></div>
      </section>

      <div class="settings-card">
        <label class="settings-label" for="max-posts">
          <span>Max posts</span>
          <span class="settings-hint">(0 = unlimited)</span>
        </label>
        <input class="settings-input" id="max-posts" type="number" min="0" max="50000" step="1" value="100" />
      </div>

      <div class="actions">
        <button class="button primary" id="start" type="button">Start scanner</button>
        <button class="button secondary" id="stop" type="button">Stop</button>
      </div>

      <div class="export-actions">
        <!-- Exports are manual so scanning never triggers an unexpected download. -->
        <button class="button secondary" id="export-json" type="button">Export JSON</button>
        <button class="button secondary" id="export-txt" type="button">Export TXT</button>
      </div>

      <button class="clear-button" id="clear-state" type="button">Clear saved data</button>

      <section class="activity">
        <div class="section-heading"><span>Activity</span><span id="log-count">0 events</span></div>
        <ol class="log-list" id="logs" aria-live="polite"></ol>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
