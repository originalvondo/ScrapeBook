<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h3 {
      margin: 0 0 16px;
      font-size: 16px;
      color: #333;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #3367d6;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      min-height: 20px;
    }
    .status.success { color: #34a853; }
    .status.error { color: #ea4335; }
  </style>
</head>
<body>
  <h3>Feed Scroller</h3>
  <button id="startBtn">Start Scrolling</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
