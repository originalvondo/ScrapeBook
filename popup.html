<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h3 {
      margin: 0 0 16px;
      font-size: 16px;
      color: #333;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #3367d6;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      min-height: 20px;
    }
    .status.success { color: #34a853; }
    .status.error { color: #ea4335; }
    .log-container {
      margin-top: 16px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fafafa;
    }
    .log-entry {
      padding: 8px 12px;
      font-size: 12px;
      font-family: monospace;
      border-bottom: 1px solid #eee;
      display: flex;
      gap: 8px;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-time { color: #999; white-space: nowrap; }
    .log-level { font-weight: bold; text-transform: uppercase; white-space: nowrap; }
    .log-level.info { color: #4285f4; }
    .log-level.success { color: #34a853; }
    .log-level.warning { color: #fbbc04; }
    .log-level.error { color: #ea4335; }
    .log-level.action { color: #9c27b0; }
    .log-message { flex: 1; color: #333; }
    .log-data { color: #666; font-size: 11px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clear-logs {
      margin-top: 8px;
      padding: 6px;
      background: #f1f3f4;
      color: #333;
      font-size: 12px;
    }
    .clear-logs:hover { background: #e8eaed; }
  </style>
</head>
<body>
  <h3>Feed Scroller</h3>
  <button id="startBtn">Start Scrolling</button>
  <div id="status" class="status"></div>
  <div class="log-container" id="logContainer"></div>
  <button id="clearLogs" class="clear-logs">Clear Logs</button>
  <script src="popup.js"></script>
</body>
</html>
